<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Datang di Cloudflare Pages</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f37021 0%, #0051c3 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
            width: 100%;
        }

        .badge {
            background-color: #ffebd6;
            color: #f37021;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #e0e0e0;
        }

        .btn {
            display: inline-block;
            background-color: #fff;
            color: #0051c3;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            background-color: #f37021;
            color: #fff;
            transform: translateY(-3px);
        }

        footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">🚀 Berhasil Online!</div>
        <h1>Halo Dunia!</h1>
        <p>Website contoh ini berhasil dideploy menggunakan <strong>Cloudflare Pages</strong> secara gratis.</p>
        <a href="https://dash.cloudflare.com/" target="_blank" class="btn">Kembali ke Dashboard</a>
        
        <footer>
            <p style="font-size: 0.85rem; margin-bottom: 0;">© 2026 Proyek Uji Coba Cloudflare</p>
        </footer>
    </div>

</body>
</html>
